plugins {
    id 'com.android.application'
}

// google-services подключается только когда в этой папке лежит
// google-services.json из Firebase Console. Без него APK тоже соберётся
// (приложение будет работать, но push-уведомления не придут).
if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.playzone.crm'
    compileSdk 34

    defaultConfig {
        applicationId "com.playzone.crm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('playzone.keystore')
            storeType 'PKCS12'
            storePassword 'PlayZone2024'
            keyAlias 'playzone'
            keyPassword 'PlayZone2024'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}
